kind = "web"
previewPath = "/"
title = "Padel Coach AI"
version = "1.0.0"
id = "artifacts/padel-coach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25005

[services.development]
run = "pnpm --filter @workspace/padel-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/padel-coach", "run", "build" ]
serve = "static"
publicDir = "artifacts/padel-coach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25005"
BASE_PATH = "/"
